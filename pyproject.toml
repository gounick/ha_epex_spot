[project]
name = "ha_epex_spot"
version = "4.1.0"
description = "Home Assistant EPEX Spot custom integration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["aiohttp>=3.9", "pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 60

[dependency-groups]
dev = [
    "aiohttp>=3.14.3",
    "homeassistant>=0.31.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
